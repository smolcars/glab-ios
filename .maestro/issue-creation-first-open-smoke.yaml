appId: com.glab.ios
name: Issue creation renders on first presentation
---
- stopApp
- launchApp
- assertVisible:
    id: home.newIssueButton
- tapOn:
    id: home.newIssueButton
- assertVisible: New Issue
- assertVisible:
    id: issueCreation.project
- assertVisible:
    id: issueCreation.title
- takeScreenshot: issue-creation-first-open
- tapOn:
    id: issueCreation.project
- assertVisible: Project
- assertVisible:
    id: "issueCreation.projects.(loading|error|empty|list)"
- waitForAnimationToEnd
- takeScreenshot: issue-creation-project-first-open
- tapOn: New Issue
- assertVisible:
    id: issueCreation.title
- tapOn:
    id: issueCreation.cancel
- assertVisible:
    id: home.accountButton
- tapOn:
    id: home.accountButton
- assertVisible: Account
- assertVisible:
    id: account.doneButton
- tapOn:
    id: account.doneButton
- assertVisible:
    id: home.newIssueButton
- assertVisible:
    id: home.newIssueButton
- tapOn:
    id: home.newIssueButton
- assertVisible: New Issue
- assertVisible:
    id: issueCreation.project
- assertVisible:
    id: issueCreation.title
- tapOn:
    id: issueCreation.cancel
