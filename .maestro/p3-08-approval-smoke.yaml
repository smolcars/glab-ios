appId: com.glab.ios
name: P3-08 compact approval management
---
- launchApp:
    arguments:
      p3_08_approval_fixture: "true"
- assertVisible: Approval UI fixture
- assertVisible:
    id: mergeRequests.approvals.summary
- waitForAnimationToEnd
- takeScreenshot: p3-08-approvals-collapsed
- tapOn:
    id: mergeRequests.approvals.summary
- assertVisible: Security review
- assertVisible: Ada Lovelace
- scrollUntilVisible:
    element:
      text: GitLab manages this rule.
    direction: DOWN
- assertVisible: GitLab manages this rule.
- scrollUntilVisible:
    element:
      text: Hidden group membership; manage this rule in GitLab.
    direction: DOWN
- assertVisible: Hidden group membership; manage this rule in GitLab.
- scrollUntilVisible:
    element:
      text: Complete rule membership is unavailable.
    direction: DOWN
- assertVisible: Complete rule membership is unavailable.
- scrollUntilVisible:
    element:
      id: mergeRequests.approvals.approve
    direction: DOWN
- assertVisible:
    id: mergeRequests.approvals.approve
- waitForAnimationToEnd
- takeScreenshot: p3-08-approvals-expanded
- tapOn:
    id: mergeRequests.approvals.approve
- assertVisible: Approve merge request?
- tapOn: Cancel
- scrollUntilVisible:
    element:
      id: mergeRequests.approvals.rule.add
    direction: UP
- tapOn:
    id: mergeRequests.approvals.rule.add
- assertVisible: Add approver
- assertVisible: Margaret Hamilton
- assertVisible: Katherine Johnson
- takeScreenshot: p3-08-approver-picker
- tapOn: Cancel
