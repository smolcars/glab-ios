name: Publish Release

on:
  push:
    tags:
      - "**"

permissions:
  contents: write

jobs:
  release:
    if: github.event.deleted == false
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --generate-notes
          --verify-tag
